<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #e6edf3; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .org-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #c9d1d9; }
    .repo-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #58a6ff; }
    .repo-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .axis-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="818" height="258" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- LEFT SECTION: Activity Overview Details -->
  <g transform="translate(24, 22)">
    <!-- Section Title -->
    <text x="0" y="14" class="title">Activity overview</text>

    <!-- Organization Tags -->
    <g transform="translate(0, 32)">
      <!-- CodingGita Badge -->
      <g>
        <rect x="0" y="0" width="112" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <rect x="6" y="5" width="18" height="18" rx="4" fill="#a371f7" />
        <text x="11" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">M</text>
        <text x="30" y="18" class="org-text">@codinggita</text>
      </g>

      <!-- FOSSASIA Badge -->
      <g transform="translate(120, 0)">
        <rect x="0" y="0" width="102" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <rect x="6" y="5" width="18" height="18" rx="4" fill="#da3633" />
        <text x="7" y="17" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff">FOSS</text>
        <text x="29" y="18" class="org-text">@fossasia</text>
      </g>

      <!-- HSF Badge -->
      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="76" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <rect x="6" y="5" width="18" height="18" rx="4" fill="#1f6feb" />
        <text x="8" y="17" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">HSF</text>
        <text x="29" y="18" class="org-text">@HSF</text>
      </g>
    </g>

    <!-- Contributions Summary List -->
    <g transform="translate(2, 85)">
      <!-- Book icon -->
      <path d="M0 2.75C0 1.784.784 1 1.75 1h9.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 11.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25Z" fill="#8b949e"/>
      
      <text x="20" y="12" class="repo-sub">Contributed to</text>
      <text x="108" y="12" class="repo-link">fossasia/scrum_helper</text>
      <text x="245" y="12" class="repo-sub">(Merged PR #872!)</text>

      <text x="20" y="34" class="repo-link">fossasia/visdom</text>
      <text x="118" y="34" class="repo-sub">, </text>
      <text x="130" y="34" class="repo-link">apache/cordova-docs</text>
      <text x="260" y="34" class="repo-sub">, </text>

      <text x="20" y="56" class="repo-link">codinggita/ressuenet</text>
      <text x="156" y="56" class="repo-sub">, and </text>
      <text x="194" y="56" class="repo-link">40+ other repositories</text>
    </g>

    <!-- Quick Stat Pills at bottom -->
    <g transform="translate(2, 180)">
      <rect x="0" y="0" width="135" height="24" rx="12" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-width="1" />
      <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#3fb950">✓ 1st PR Merged in FOSS</text>

      <rect x="145" y="0" width="140" height="24" rx="12" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1" />
      <text x="155" y="16" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#58a6ff">★ 2 More Approved</text>
    </g>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="390" y1="20" x2="390" y2="240" stroke="#30363d" stroke-width="1" />

  <!-- RIGHT SECTION: GitHub Activity Radar Graph -->
  <g transform="translate(605, 130)">
    <!-- Radar Grid Circles -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#30363d" stroke-width="1" />

    <!-- Axes Lines -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#30363d" stroke-width="1.5" />
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#30363d" stroke-width="1.5" />

    <!-- Active Quadrant Cross Highlight (Green) -->
    <line x1="-70" y1="0" x2="10" y2="0" stroke="#2ea043" stroke-width="1.8" />
    <line x1="0" y1="-15" x2="0" y2="30" stroke="#2ea043" stroke-width="1.8" />

    <!-- Polygon Data Area (Commits: 74%, PRs: 19%, Code Review: 6%, Issues: 1%) -->
    <!-- Scale: 75px = 80%. 74% = ~68px left, 19% = ~20px down, 6% = ~10px up, 1% = ~4px right -->
    <polygon points="0,-10 5,0 0,22 -68,0" fill="url(#radarFill)" stroke="#39d353" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Data Points (Green Dots with White Inner Core) -->
    <!-- Code Review (Top) -->
    <circle cx="0" cy="-10" r="3.5" fill="#39d353" stroke="#0d1117" stroke-width="1.5" />
    
    <!-- Issues (Right) -->
    <circle cx="5" cy="0" r="3.5" fill="#39d353" stroke="#0d1117" stroke-width="1.5" />

    <!-- Pull Requests (Bottom) -->
    <circle cx="0" cy="22" r="3.5" fill="#39d353" stroke="#0d1117" stroke-width="1.5" />

    <!-- Commits (Left) -->
    <circle cx="-68" cy="0" r="4" fill="#39d353" stroke="#ffffff" stroke-width="1.5" />

    <!-- AXIS LABELS & PERCENTAGES -->
    <!-- Top: Code Review 6% -->
    <text x="0" y="-103" text-anchor="middle" class="axis-val">6%</text>
    <text x="0" y="-90" text-anchor="middle" class="axis-label">Code review</text>

    <!-- Right: Issues 1% -->
    <text x="96" y="-3" text-anchor="start" class="axis-val">1%</text>
    <text x="96" y="11" text-anchor="start" class="axis-label">Issues</text>

    <!-- Bottom: Pull Requests 19% -->
    <text x="0" y="100" text-anchor="middle" class="axis-val">19%</text>
    <text x="0" y="114" text-anchor="middle" class="axis-label">Pull requests</text>

    <!-- Left: Commits 74% -->
    <text x="-98" y="-3" text-anchor="end" class="axis-val">74%</text>
    <text x="-98" y="11" text-anchor="end" class="axis-label">Commits</text>
  </g>
</svg>
