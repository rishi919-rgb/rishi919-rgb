<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.25" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 600; fill: #e6edf3; }
    .org-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #c9d1d9; }
    .repo-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #58a6ff; }
    .repo-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8b949e; }
    .axis-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="818" height="228" rx="8" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1" />

  <!-- LEFT SECTION: Activity Overview Details -->
  <g transform="translate(28, 24)">
    <!-- Section Title -->
    <text x="0" y="12" class="title">Activity overview</text>

    <!-- Organization Tags -->
    <g transform="translate(0, 30)">
      <!-- CodingGita Badge -->
      <g>
        <rect x="0" y="0" width="108" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <rect x="6" y="5" width="16" height="16" rx="3" fill="#8957e5" />
        <text x="10" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">M</text>
        <text x="28" y="17" class="org-text">@codinggita</text>
      </g>

      <!-- FOSSASIA Badge -->
      <g transform="translate(116, 0)">
        <rect x="0" y="0" width="98" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <rect x="6" y="5" width="16" height="16" rx="3" fill="#da3633" />
        <text x="7" y="16" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#ffffff">FOSS</text>
        <text x="27" y="17" class="org-text">@fossasia</text>
      </g>

      <!-- HSF Badge -->
      <g transform="translate(222, 0)">
        <rect x="0" y="0" width="72" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <rect x="6" y="5" width="16" height="16" rx="3" fill="#1f6feb" />
        <text x="7" y="16" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="bold" fill="#ffffff">HSF</text>
        <text x="27" y="17" class="org-text">@HSF</text>
      </g>
    </g>

    <!-- Contributions Summary List -->
    <g transform="translate(0, 85)">
      <!-- Repository Icon -->
      <path d="M0 1.75A.75.75 0 0 1 .75 1h9.5a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75 9.5h8.5V2.5H1.75a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25Z" fill="#8b949e"/>
      
      <text x="20" y="11" class="repo-sub">Contributed to</text>
      <text x="108" y="11" class="repo-link">DashratRajpurohit/Leetcode</text>
      <text x="282" y="11" class="repo-sub">, </text>

      <text x="20" y="33" class="repo-link">fossasia/scrum_helper</text>
      <text x="162" y="33" class="repo-sub">, </text>
      <text x="174" y="33" class="repo-link">fossasia/visdom</text>
      <text x="276" y="33" class="repo-sub">, </text>

      <text x="20" y="55" class="repo-link">codinggita/ressuenet</text>
      <text x="155" y="55" class="repo-sub"> and </text>
      <text x="187" y="55" class="repo-link">40 other repositories</text>
    </g>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="410" y1="20" x2="410" y2="210" stroke="#30363d" stroke-width="1" />

  <!-- RIGHT SECTION: GitHub Activity Radar Graph -->
  <g transform="translate(615, 115)">
    <!-- Radar Grid Circles -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="2 2" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#30363d" stroke-width="1" />

    <!-- Axes Lines -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#30363d" stroke-width="1.2" />
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#30363d" stroke-width="1.2" />

    <!-- Active Cross Segments (Green Accent) -->
    <line x1="-65" y1="0" x2="8" y2="0" stroke="#2ea043" stroke-width="1.6" />
    <line x1="0" y1="-12" x2="0" y2="24" stroke="#2ea043" stroke-width="1.6" />

    <!-- Polygon Data Area (Commits: 74%, PRs: 19%, Code Review: 6%, Issues: 1%) -->
    <polygon points="0,-8 4,0 0,18 -62,0" fill="url(#radarFill)" stroke="#39d353" stroke-width="2.2" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Data Points -->
    <circle cx="0" cy="-8" r="3" fill="#39d353" stroke="#0d1117" stroke-width="1.2" />
    <circle cx="4" cy="0" r="3" fill="#39d353" stroke="#0d1117" stroke-width="1.2" />
    <circle cx="0" cy="18" r="3" fill="#39d353" stroke="#0d1117" stroke-width="1.2" />
    <circle cx="-62" cy="0" r="3.5" fill="#39d353" stroke="#ffffff" stroke-width="1.2" />

    <!-- AXIS LABELS & PERCENTAGES -->
    <!-- Top: Code Review 6% -->
    <text x="0" y="-96" text-anchor="middle" class="axis-val">6%</text>
    <text x="0" y="-84" text-anchor="middle" class="axis-label">Code review</text>

    <!-- Right: Issues 1% -->
    <text x="88" y="-3" text-anchor="start" class="axis-val">1%</text>
    <text x="88" y="10" text-anchor="start" class="axis-label">Issues</text>

    <!-- Bottom: Pull Requests 19% -->
    <text x="0" y="94" text-anchor="middle" class="axis-val">19%</text>
    <text x="0" y="107" text-anchor="middle" class="axis-label">Pull requests</text>

    <!-- Left: Commits 74% -->
    <text x="-90" y="-3" text-anchor="end" class="axis-val">74%</text>
    <text x="-90" y="10" text-anchor="end" class="axis-label">Commits</text>
  </g>
</svg>
